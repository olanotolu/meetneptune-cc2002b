name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: unit tests (incl. adversarial tamper checks)
        run: make test

      - name: fill + reopen-and-prove the three committed samples
        run: make check
