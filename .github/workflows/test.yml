name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install from the lockfile
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: types
        run: uv run mypy

      - name: unit tests (incl. adversarial tamper checks)
        run: make test

      - name: fill + reopen-and-prove the three committed samples
        run: make check

      - name: sign a filing and verify it against a pinned key
        run: make sign-check
